name: Build TinyOS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cpio \
            gzip \
            xz-utils \
            rsync \
            wget \
            file \
            util-linux \
            kmod \
            sudo

      - name: Download TazLab
        run: |
          git clone https://github.com/pankso/tazlab.git
          chmod +x tazlab/tazlab

      - name: Configure TazLab
        run: |
          cat > tazlab/tazlab.conf << EOF
          SLITAZ_HOME="$GITHUB_WORKSPACE/.slitaz"
          ARCH="x86_64"
          BUILDER="$USER"
          EOF

      - name: Check TazLab
        working-directory: tazlab
        run: |
          ./tazlab check

      - name: Create SliTaz x86_64 environment
        working-directory: tazlab
        run: |
          ./tazlab setup x86_64

      - name: Install TinyOS packages
        working-directory: tazlab
        run: |
          ./tazlab run x86_64 '
            set -e

            echo "Refreshing package database..."
            tazpkg recharge

            echo "Installing TazLito..."
            tazpkg get-install tazlito

            echo "Installing ISO creation tools..."
            tazpkg get-install cdrkit

            tazpkg get-install syslinux || true

            echo "Checking ISO tools..."
            command -v genisoimage

            echo "Installing Firefox..."
            tazpkg get-install firefox

            echo "Installing X server..."
            tazpkg get-install xorg-server

            echo "Installing X initialization..."
            tazpkg get-install xorg-xinit

            echo "Installing Openbox..."
            tazpkg get-install openbox

            echo "Installing terminal..."
            tazpkg get-install xterm

            echo "Installing Wi-Fi..."
            tazpkg get-install wpa_supplicant
            tazpkg get-install dhcpcd

            echo "Installing Bluetooth..."
            tazpkg get-install bluez

            echo "Installing D-Bus..."
            tazpkg get-install dbus

            echo "TinyOS packages installed."
          '

      - name: Configure TinyOS
        working-directory: tazlab
        run: |
          ./tazlab run x86_64 '
            set -e

            echo "tinyos" > /etc/hostname

            cat > /etc/os-release << "EOF"
            PRETTY_NAME="MEGHRAJ OS"
            NAME="MEGHRAJ OS"
            ID=meghrajos
            VERSION="0.1"
            VERSION_ID="0.1"
            ID_LIKE=slitaz
            EOF

            echo "Creating X startup..."

            mkdir -p /etc/X11/xinit

            cat > /etc/X11/xinit/xinitrc << "EOF"
            #!/bin/sh

            exec openbox-session
            EOF

            chmod +x /etc/X11/xinit/xinitrc

            echo "Creating Openbox configuration..."

            mkdir -p /etc/xdg/openbox

            cat > /etc/xdg/openbox/rc.xml << "EOF"
            <?xml version="1.0" encoding="UTF-8"?>

            <openbox_config
              xmlns="http://openbox.org/3.5/rc"
              xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
              xsi:schemaLocation="http://openbox.org/3.5/rc
              https://openbox.org/3.5/rc">

              <focus>
                <focusNew>yes</focusNew>
                <followMouse>no</followMouse>
                <focusLast>yes</focusLast>
                <underMouse>no</underMouse>
                <lastFocusNewWindow>yes</lastFocusNewWindow>
              </focus>

              <placement>
                <policy>Smart</policy>
              </placement>

              <mouse>
                <context name="Root">

                  <mousebind button="Right" action="Press">
                    <action name="ShowMenu">
                      <menu>root-menu</menu>
                    </action>
                  </mousebind>

                </context>
              </mouse>

              <desktops>
                <number>1</number>
                <firstdesk>1</firstdesk>
              </desktops>

              <menu>
                <file>/etc/xdg/openbox/menu.xml</file>
              </menu>

            </openbox_config>
            EOF

            echo "Creating MEGHRAJ right-click menu..."

            cat > /etc/xdg/openbox/menu.xml << "EOF"
            <?xml version="1.0" encoding="UTF-8"?>

            <openbox_menu
              xmlns="http://openbox.org/"
              xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
              xsi:schemaLocation="http://openbox.org/
              file:///usr/share/openbox/menu.xsd">

              <menu id="root-menu" label="MEGHRAJ OS">

                <separator label="MEGHRAJ OS" />

                <item label="Firefox">
                  <action name="Execute">
                    <command>firefox</command>
                  </action>
                </item>

                <item label="Terminal">
                  <action name="Execute">
                    <command>xterm</command>
                  </action>
                </item>

                <separator />

                <item label="MEGHRAJ OS">
                  <action name="Execute">
                    <command>xterm -title "MEGHRAJ OS"</command>
                  </action>
                </item>

                <separator />

                <item label="Reboot">
                  <action name="Execute">
                    <command>reboot</command>
                  </action>
                </item>

                <item label="Shutdown">
                  <action name="Execute">
                    <command>poweroff</command>
                  </action>
                </item>

              </menu>

            </openbox_menu>
            EOF

            echo "Creating Firefox launcher..."

            cat > /usr/bin/firefox-start << "EOF"
            #!/bin/sh
            exec firefox
            EOF

            chmod +x /usr/bin/firefox-start

            echo "Creating TinyOS terminal launcher..."

            cat > /usr/bin/meghraj-terminal << "EOF"
            #!/bin/sh
            exec xterm -title "MEGHRAJ OS"
            EOF

            chmod +x /usr/bin/meghraj-terminal

            echo "Cleaning unnecessary files..."

            rm -rf /var/cache/tazpkg/*
            rm -rf /var/log/*
            rm -rf /tmp/*
            rm -rf /var/tmp/*

            rm -rf /usr/share/doc/*
            rm -rf /usr/share/info/*
            rm -rf /usr/share/man/*

            echo "TinyOS configuration complete."
          '

      - name: Build TinyOS ISO
        working-directory: tazlab
        run: |
          ./tazlab run x86_64 '
            set -e

            SOURCE_ISO="/home/slitaz/iso/slitaz-base-x86_64-cooking.iso"

            echo "Source ISO:"
            echo "$SOURCE_ISO"

            if [ ! -f "$SOURCE_ISO" ]; then
              echo "ERROR: Source SliTaz ISO not found."
              exit 1
            fi

            echo "Preparing source ISO mount..."

            mkdir -p /media/cdrom

            if mountpoint -q /media/cdrom; then
              umount /media/cdrom
            fi

            mount -o loop,ro "$SOURCE_ISO" /media/cdrom

            echo "Checking boot files..."

            ls -la /media/cdrom/boot || true
            ls -la /media/cdrom/boot/isolinux || true

            if [ ! -d /media/cdrom/boot/isolinux ]; then
              echo "ERROR: Source ISO does not contain the required isolinux directory."
              exit 1
            fi

            echo "Unmounting TazLab shared distro directory..."

            if mountpoint -q /home/slitaz/distro; then
              umount /home/slitaz/distro
            fi

            rm -rf /home/slitaz/distro
            mkdir -p /home/slitaz/distro

            echo "Preparing ISO output directory..."

            mkdir -p /home/slitaz/iso

            rm -f /home/slitaz/iso/TinyOS.iso
            rm -f /home/slitaz/iso/TinyOS.md5

            echo "Running TazLito..."

            LaunchedByTazpanel=1 \
              tazlito writeiso lzma TinyOS

            echo "Checking TazLito output..."

            if [ ! -f /home/slitaz/distro/TinyOS.iso ]; then
              echo "ERROR: TazLito did not create TinyOS.iso."

              echo "Distro directory:"
              find /home/slitaz/distro \
                -maxdepth 3 \
                -type f \
                -print 2>/dev/null || true

              exit 1
            fi

            SIZE=$(stat -c "%s" /home/slitaz/distro/TinyOS.iso)

            echo "Generated ISO size:"
            echo "$SIZE bytes"

            if [ "$SIZE" -lt 1000000 ]; then
              echo "ERROR: ISO is suspiciously small."
              exit 1
            fi

            echo "Copying final ISO to shared GitHub directory..."

            cp -f \
              /home/slitaz/distro/TinyOS.iso \
              /home/slitaz/iso/TinyOS.iso

            cp -f \
              /home/slitaz/distro/TinyOS.md5 \
              /home/slitaz/iso/TinyOS.md5 \
              2>/dev/null || true

            echo "Final ISO:"
            ls -lh /home/slitaz/iso/TinyOS.iso

            echo "Unmounting source ISO..."

            umount /media/cdrom || true
          '

      - name: Verify generated ISO
        run: |
          ISO="$GITHUB_WORKSPACE/.slitaz/iso/TinyOS.iso"

          echo "Checking final ISO:"
          echo "$ISO"

          if [ ! -f "$ISO" ]; then
            echo "ERROR: TinyOS.iso was not created."

            echo "Files in shared ISO directory:"
            find "$GITHUB_WORKSPACE/.slitaz/iso" \
              -maxdepth 1 \
              -type f \
              -print \
              2>/dev/null || true

            exit 1
          fi

          SIZE=$(stat -c "%s" "$ISO")

          if [ "$SIZE" -lt 1000000 ]; then
            echo "ERROR: ISO is too small."
            exit 1
          fi

          echo "ISO verified successfully."

          file "$ISO"
          ls -lh "$ISO"

      - name: Measure ISO size
        run: |
          ISO="$GITHUB_WORKSPACE/.slitaz/iso/TinyOS.iso"

          SIZE_MB=$(du -m "$ISO" | cut -f1)

          echo "======================================"
          echo "MEGHRAJ OS ISO SIZE: ${SIZE_MB} MB"
          echo "======================================"

          if [ "$SIZE_MB" -le 50 ]; then
            echo "50 MB TARGET ACHIEVED"
          else
            echo "Above 50 MB."
            echo "We will optimize after successful boot."
          fi

      - name: Upload TinyOS ISO
        uses: actions/upload-artifact@v6
        with:
          name: MEGHRAJ-OS-ISO
          path: ".slitaz/iso/TinyOS.iso"
          if-no-files-found: error
