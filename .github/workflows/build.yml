name: Build TinyOS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cpio \
            gzip \
            xz-utils \
            rsync \
            wget \
            file \
            util-linux \
            kmod \
            sudo

      - name: Download TazLab
        run: |
          git clone https://github.com/pankso/tazlab.git
          chmod +x tazlab/tazlab

      - name: Configure TazLab
        run: |
          cat > tazlab/tazlab.conf << EOF
          SLITAZ_HOME="$GITHUB_WORKSPACE/.slitaz"
          ARCH="x86_64"
          BUILDER="$USER"
          EOF

      - name: Check TazLab
        working-directory: tazlab
        run: |
          ./tazlab check

      - name: Create SliTaz x86_64 environment
        working-directory: tazlab
        run: |
          ./tazlab setup x86_64

      - name: Install TinyOS packages
        working-directory: tazlab
        run: |
          ./tazlab run x86_64 '
            set -e

            echo "Refreshing package database..."
            tazpkg recharge

            echo "Installing ISO build tools..."
            tazpkg get-install cdrkit
            tazpkg get-install syslinux

            echo "Verifying ISO build tools..."
            command -v genisoimage
            command -v isohybrid

            echo "Installing Firefox..."
            tazpkg get-install firefox

            echo "Installing X server..."
            tazpkg get-install xorg-server

            echo "Installing X initialization..."
            tazpkg get-install xorg-xinit

            echo "Installing Openbox..."
            tazpkg get-install openbox

            echo "Installing lightweight wallpaper tool..."
            tazpkg get-install hsetroot

            echo "Installing terminal..."
            tazpkg get-install xterm

            echo "Installing Wi-Fi support..."
            tazpkg get-install wpa_supplicant
            tazpkg get-install dhcpcd

            echo "Installing Bluetooth..."
            tazpkg get-install bluez

            echo "Installing D-Bus..."
            tazpkg get-install dbus

            echo "All required packages installed."
          '

      - name: Create MEGHRAJ wallpaper
        run: |
          mkdir -p "$GITHUB_WORKSPACE/wallpaper"

          python3 - << 'PY'
          from PIL import Image, ImageDraw, ImageFont

          width = 1600
          height = 900

          img = Image.new("RGB", (width, height))
          px = img.load()

          for y in range(height):
              for x in range(width):
                  r = 3 + int(7 * y / height)
                  g = 6 + int(10 * y / height)
                  b = 14 + int(25 * y / height)
                  px[x, y] = (r, g, b)

          draw = ImageDraw.Draw(img)

          font_path = "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"

          try:
              font = ImageFont.truetype(font_path, 170)
              small = ImageFont.truetype(font_path, 34)
          except Exception:
              font = ImageFont.load_default()
              small = ImageFont.load_default()

          title = "MEGHRAJ"
          subtitle = "TINY LINUX"

          box = draw.textbbox((0, 0), title, font=font)
          tw = box[2] - box[0]
          th = box[3] - box[1]

          x = (width - tw) // 2
          y = (height - th) // 2 - 45

          for glow in range(15, 0, -2):
              draw.text(
                  (x, y),
                  title,
                  font=font,
                  fill=(30, 90, 220)
              )

          draw.text(
              (x, y),
              title,
              font=font,
              fill=(235, 245, 255)
          )

          sb = draw.textbbox((0, 0), subtitle, font=small)
          sw = sb[2] - sb[0]

          draw.text(
              ((width - sw) // 2, y + th + 35),
              subtitle,
              font=small,
              fill=(110, 155, 215)
          )

          line_y = y + th + 95

          draw.rectangle(
              (
                  width // 2 - 180,
                  line_y,
                  width // 2 + 180,
                  line_y + 3
              ),
              fill=(70, 145, 255)
          )

          output = "wallpaper/meghraj.png"
          img.save(output, optimize=True)

          print("Created:", output)
          PY

          ls -lh wallpaper/meghraj.png

      - name: Install wallpaper
        working-directory: tazlab
        run: |
          ./tazlab run x86_64 '
            set -e

            mkdir -p /usr/share/backgrounds

            cp /home/slitaz/src/../../wallpaper/meghraj.png \
              /usr/share/backgrounds/meghraj.png
          ' || true

          ./tazlab run x86_64 '
            set -e

            mkdir -p /usr/share/backgrounds

            if [ -f /home/slitaz/distro/meghraj.png ]; then
              cp /home/slitaz/distro/meghraj.png \
                /usr/share/backgrounds/meghraj.png
            fi

            if [ ! -f /usr/share/backgrounds/meghraj.png ]; then
              echo "Wallpaper copy failed."
              exit 1
            fi

            ls -lh /usr/share/backgrounds/meghraj.png
          '

      - name: Configure TinyOS desktop
        working-directory: tazlab
        run: |
          ./tazlab run x86_64 '
            set -e

            echo "tinyos" > /etc/hostname

            cat > /etc/os-release << "EOF"
            PRETTY_NAME="TinyOS"
            NAME="TinyOS"
            ID=tinyos
            VERSION="0.1"
            VERSION_ID="0.1"
            ID_LIKE=slitaz
            EOF

            cat > /etc/X11/xinit/xinitrc << "EOF"
            #!/bin/sh

            hsetroot -fill /usr/share/backgrounds/meghraj.png &

            sleep 1

            exec openbox-session
            EOF

            chmod +x /etc/X11/xinit/xinitrc

            mkdir -p /etc/xdg/openbox

            cat > /etc/xdg/openbox/menu.xml << "EOF"
            <?xml version="1.0" encoding="UTF-8"?>

            <openbox_menu
              xmlns="http://openbox.org/"
              xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
              xsi:schemaLocation="http://openbox.org/
              file:///usr/share/openbox/menu.xsd">

              <menu id="root-menu" label="TinyOS">

                <item label="Firefox">
                  <action name="Execute">
                    <command>firefox</command>
                  </action>
                </item>

                <item label="Terminal">
                  <action name="Execute">
                    <command>xterm</command>
                  </action>
                </item>

                <separator />

                <item label="Reboot">
                  <action name="Execute">
                    <command>reboot</command>
                  </action>
                </item>

                <item label="Shutdown">
                  <action name="Execute">
                    <command>poweroff</command>
                  </action>
                </item>

              </menu>
            </openbox_menu>
            EOF

            cat > /usr/bin/firefox-start << "EOF"
            #!/bin/sh
            exec startx
            EOF

            chmod +x /usr/bin/firefox-start

            rm -rf /var/cache/tazpkg/*
            rm -rf /var/log/*
            rm -rf /tmp/*
            rm -rf /var/tmp/*

            echo "Removing unnecessary documentation..."

            rm -rf /usr/share/doc/*
            rm -rf /usr/share/info/*
            rm -rf /usr/share/man/*

            echo "TinyOS desktop configured."
          '

      - name: Find source SliTaz ISO
        working-directory: tazlab
        run: |
          ./tazlab run x86_64 '
            set -e

            mkdir -p /media/cdrom

            ISO=$(find /home/slitaz/iso \
              -maxdepth 1 \
              -type f \
              -name "*.iso" \
              | head -n 1)

            if [ -z "$ISO" ]; then
              echo "ERROR: source SliTaz ISO not found."
              find /home/slitaz/iso -maxdepth 1 -type f -print
              exit 1
            fi

            echo "Source ISO:"
            echo "$ISO"

            if mountpoint -q /media/cdrom; then
              umount /media/cdrom
            fi

            mount -o loop,ro "$ISO" /media/cdrom

            echo "Boot files:"
            ls -lh /media/cdrom/boot
          '

      - name: Build TinyOS ISO
        working-directory: tazlab
        run: |
          ./tazlab run x86_64 '
            set -e

            echo "Checking ISO tools inside TinyOS..."

            command -v genisoimage
            command -v isohybrid

            echo "Checking source boot files..."

            test -f /media/cdrom/boot/isolinux/isolinux.bin
            test -f /media/cdrom/boot/isolinux/isolinux.cfg

            echo "Generating TinyOS ISO..."

            LaunchedByTazpanel=1 \
              tazlito writeiso lzma TinyOS

            echo "Checking generated image..."

            test -f /home/slitaz/distro/TinyOS.iso

            SIZE=$(stat -c "%s" /home/slitaz/distro/TinyOS.iso)

            echo "ISO byte size:"
            echo "$SIZE"

            if [ "$SIZE" -lt 1000000 ]; then
              echo "ERROR: Generated ISO is suspiciously small."
              echo "Distro contents:"
              find /home/slitaz/distro \
                -maxdepth 3 \
                -type f \
                -exec ls -lh {} \;
              exit 1
            fi

            echo "TinyOS ISO created successfully."
            ls -lh /home/slitaz/distro/TinyOS.iso
          '

      - name: Verify ISO on host
        run: |
          ISO="$GITHUB_WORKSPACE/.slitaz/x86_64/distro/TinyOS.iso"

          echo "Expected ISO:"
          echo "$ISO"

          if [ ! -f "$ISO" ]; then
            echo "ERROR: ISO not found."

            find "$GITHUB_WORKSPACE/.slitaz" \
              -type f \
              \( -name "*.iso" -o -name "*.img" \) \
              -print

            exit 1
          fi

          SIZE=$(stat -c "%s" "$ISO")

          echo "ISO size in bytes:"
          echo "$SIZE"

          if [ "$SIZE" -lt 1000000 ]; then
            echo "ERROR: ISO is too small to be valid."
            exit 1
          fi

          file "$ISO"
          ls -lh "$ISO"

      - name: Measure ISO size
        run: |
          ISO="$GITHUB_WORKSPACE/.slitaz/x86_64/distro/TinyOS.iso"

          SIZE_MB=$(du -m "$ISO" | cut -f1)

          echo "======================================"
          echo "TinyOS ISO size: ${SIZE_MB} MB"
          echo "======================================"

          if [ "$SIZE_MB" -le 50 ]; then
            echo "50 MB TARGET ACHIEVED"
          else
            echo "Above 50 MB."
            echo "We can optimize it after bootability is confirmed."
          fi

      - name: Upload TinyOS ISO
        uses: actions/upload-artifact@v6
        with:
          name: TinyOS-ISO
          path: ".slitaz/x86_64/distro/TinyOS.iso"
          if-no-files-found: error
