name: Build MEGHRAJ OS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cpio \
            gzip \
            xz-utils \
            rsync \
            wget \
            file \
            util-linux \
            kmod \
            sudo

      - name: Download TazLab
        run: |
          git clone https://github.com/pankso/tazlab.git
          chmod +x tazlab/tazlab

      - name: Configure TazLab
        run: |
          cat > tazlab/tazlab.conf << EOF
          SLITAZ_HOME="$GITHUB_WORKSPACE/.slitaz"
          ARCH="x86_64"
          BUILDER="$USER"
          EOF

      - name: Check TazLab
        working-directory: tazlab
        run: |
          ./tazlab check

      - name: Create SliTaz environment
        working-directory: tazlab
        run: |
          ./tazlab setup x86_64

      - name: Install MEGHRAJ OS packages
        working-directory: tazlab
        run: |
          ./tazlab run x86_64 '
            set -e

            echo "Updating package database..."
            tazpkg recharge

            echo "Installing TazLito..."
            tazpkg get-install tazlito

            echo "Installing ISO tools..."
            tazpkg get-install cdrkit
            tazpkg get-install syslinux || true

            echo "Installing Firefox..."
            tazpkg get-install firefox

            echo "Installing X..."
            tazpkg get-install xorg-server
            tazpkg get-install xorg-xinit

            echo "Installing Openbox..."
            tazpkg get-install openbox

            echo "Installing terminal..."
            tazpkg get-install xterm

            echo "Installing Wi-Fi..."
            tazpkg get-install wpa_supplicant
            tazpkg get-install dhcpcd

            echo "Installing Bluetooth..."
            tazpkg get-install bluez

            echo "Installing D-Bus..."
            tazpkg get-install dbus

            echo "Packages installed."
          '

      - name: Configure MEGHRAJ OS
        working-directory: tazlab
        run: |
          ./tazlab run x86_64 '
            set -e

            echo "Setting hostname..."
            echo "meghrajos" > /etc/hostname

            echo "Creating OS information..."

            cat > /etc/os-release << "EOF"
            PRETTY_NAME="MEGHRAJ OS"
            NAME="MEGHRAJ OS"
            ID=meghrajos
            VERSION="0.1"
            VERSION_ID="0.1"
            ID_LIKE=slitaz
            EOF

            echo "Creating X startup..."

            mkdir -p /etc/X11/xinit

            cat > /etc/X11/xinit/xinitrc << "EOF"
            #!/bin/sh

            exec openbox-session
            EOF

            chmod +x /etc/X11/xinit/xinitrc

            echo "Creating Openbox configuration..."

            mkdir -p /etc/xdg/openbox

            cat > /etc/xdg/openbox/rc.xml << "EOF"
            <?xml version="1.0" encoding="UTF-8"?>

            <openbox_config
              xmlns="http://openbox.org/3.5/rc"
              xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
              xsi:schemaLocation="http://openbox.org/3.5/rc
              https://openbox.org/3.5/rc">

              <focus>
                <focusNew>yes</focusNew>
                <followMouse>no</followMouse>
                <focusLast>yes</focusLast>
                <underMouse>no</underMouse>
                <lastFocusNewWindow>yes</lastFocusNewWindow>
              </focus>

              <placement>
                <policy>Smart</policy>
              </placement>

              <mouse>
                <context name="Root">

                  <mousebind button="Right" action="Press">
                    <action name="ShowMenu">
                      <menu>root-menu</menu>
                    </action>
                  </mousebind>

                </context>
              </mouse>

              <desktops>
                <number>1</number>
                <firstdesk>1</firstdesk>
              </desktops>

              <menu>
                <file>/etc/xdg/openbox/menu.xml</file>
              </menu>

            </openbox_config>
            EOF

            echo "Creating right-click MEGHRAJ menu..."

            cat > /etc/xdg/openbox/menu.xml << "EOF"
            <?xml version="1.0" encoding="UTF-8"?>

            <openbox_menu
              xmlns="http://openbox.org/"
              xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
              xsi:schemaLocation="http://openbox.org/
              file:///usr/share/openbox/menu.xsd">

              <menu id="root-menu" label="MEGHRAJ OS">

                <separator label="MEGHRAJ OS" />

                <item label="Firefox">
                  <action name="Execute">
                    <command>firefox</command>
                  </action>
                </item>

                <item label="Terminal">
                  <action name="Execute">
                    <command>xterm -title "MEGHRAJ OS Terminal"</command>
                  </action>
                </item>

                <separator />

                <item label="MEGHRAJ OS">
                  <action name="Execute">
                    <command>xterm -title "MEGHRAJ OS"</command>
                  </action>
                </item>

                <separator />

                <item label="Reboot">
                  <action name="Execute">
                    <command>reboot</command>
                  </action>
                </item>

                <item label="Shutdown">
                  <action name="Execute">
                    <command>poweroff</command>
                  </action>
                </item>

              </menu>

            </openbox_menu>
            EOF

            echo "Creating Firefox launcher..."

            cat > /usr/bin/firefox-start << "EOF"
            #!/bin/sh
            exec startx
            EOF

            chmod +x /usr/bin/firefox-start

            echo "Cleaning caches..."

            rm -rf /var/cache/tazpkg/*
            rm -rf /var/log/*
            rm -rf /tmp/*
            rm -rf /var/tmp/*

            echo "Cleaning documentation..."

            rm -rf /usr/share/doc/*
            rm -rf /usr/share/info/*
            rm -rf /usr/share/man/*

            echo "MEGHRAJ OS configuration complete."
          '

      - name: Build ISO in private TazLito directory
        working-directory: tazlab
        run: |
          ./tazlab run x86_64 '
            set -e

            echo "Preparing original SliTaz ISO..."

            SOURCE_ISO="/home/slitaz/iso/slitaz-base-x86_64-cooking.iso"

            if [ ! -f "$SOURCE_ISO" ]; then
              echo "ERROR: Source ISO not found:"
              echo "$SOURCE_ISO"
              exit 1
            fi

            mkdir -p /media/cdrom

            if mountpoint -q /media/cdrom; then
              umount /media/cdrom || true
            fi

            mount -o loop,ro "$SOURCE_ISO" /media/cdrom

            echo "Checking source boot files..."

            test -f /media/cdrom/boot/bzImage
            test -d /media/cdrom/boot/isolinux

            echo "Patching TazLito output directory..."

            TAZLITO="/usr/bin/tazlito"

            if [ ! -f "$TAZLITO" ]; then
              echo "ERROR: TazLito not found."
              exit 1
            fi

            cp "$TAZLITO" /tmp/tazlito-original

            sed \
              "s|DISTRO='/home/slitaz/distro'|DISTRO='/tmp/meghraj-distro'|" \
              /tmp/tazlito-original \
              > /tmp/tazlito-meghraj

            chmod +x /tmp/tazlito-meghraj

            echo "Creating private build directory..."

            rm -rf /tmp/meghraj-distro
            mkdir -p /tmp/meghraj-distro

            echo "Building MEGHRAJ OS ISO..."

            LaunchedByTazpanel=1 \
              /tmp/tazlito-meghraj writeiso lzma MEGHRAJ-OS

            echo "Checking private ISO..."

            if [ ! -f /tmp/meghraj-distro/MEGHRAJ-OS.iso ]; then
              echo "ERROR: Private ISO was not created."

              echo "Private distro contents:"
              find /tmp/meghraj-distro \
                -maxdepth 3 \
                -type f \
                -print \
                2>/dev/null || true

              exit 1
            fi

            SIZE=$(stat -c "%s" /tmp/meghraj-distro/MEGHRAJ-OS.iso)

            echo "Private ISO size:"
            echo "$SIZE bytes"

            if [ "$SIZE" -lt 1000000 ]; then
              echo "ERROR: Generated ISO is suspiciously small."
              exit 1
            fi

            echo "Copying final ISO into TazLab shared directory..."

            mkdir -p /home/slitaz/iso

            cp \
              /tmp/meghraj-distro/MEGHRAJ-OS.iso \
              /home/slitaz/iso/MEGHRAJ-OS.iso

            if [ -f /tmp/meghraj-distro/MEGHRAJ-OS.md5 ]; then
              cp \
                /tmp/meghraj-distro/MEGHRAJ-OS.md5 \
                /home/slitaz/iso/MEGHRAJ-OS.md5
            fi

            echo "Final ISO copied."

            ls -lh /home/slitaz/iso/MEGHRAJ-OS.iso

            echo "Unmounting source ISO..."

            umount /media/cdrom || true
          '

      - name: Verify final ISO
        run: |
          ISO="$GITHUB_WORKSPACE/.slitaz/iso/MEGHRAJ-OS.iso"

          echo "Checking:"
          echo "$ISO"

          if [ ! -f "$ISO" ]; then
            echo "ERROR: MEGHRAJ-OS.iso was not created."

            find "$GITHUB_WORKSPACE/.slitaz/iso" \
              -maxdepth 1 \
              -type f \
              -print \
              2>/dev/null || true

            exit 1
          fi

          SIZE=$(stat -c "%s" "$ISO")

          echo "ISO bytes:"
          echo "$SIZE"

          if [ "$SIZE" -lt 1000000 ]; then
            echo "ERROR: ISO is too small."
            exit 1
          fi

          echo "ISO verified."

          file "$ISO"
          ls -lh "$ISO"

      - name: Measure ISO size
        run: |
          ISO="$GITHUB_WORKSPACE/.slitaz/iso/MEGHRAJ-OS.iso"

          SIZE_MB=$(du -m "$ISO" | cut -f1)

          echo "======================================"
          echo "MEGHRAJ OS ISO SIZE: ${SIZE_MB} MB"
          echo "======================================"

          if [ "$SIZE_MB" -le 50 ]; then
            echo "50 MB TARGET ACHIEVED"
          else
            echo "Above 50 MB."
            echo "We can optimize after bootability is confirmed."
          fi

      - name: Upload MEGHRAJ OS ISO
        uses: actions/upload-artifact@v6
        with:
          name: MEGHRAJ-OS-ISO
          path: ".slitaz/iso/MEGHRAJ-OS.iso"
          if-no-files-found: error
