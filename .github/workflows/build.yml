name: Build TinyOS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cpio \
            gzip \
            xz-utils \
            rsync \
            wget \
            file \
            util-linux \
            kmod \
            sudo

      - name: Download TazLab
        run: |
          git clone https://github.com/pankso/tazlab.git
          chmod +x tazlab/tazlab

      - name: Check TazLab
        working-directory: tazlab
        env:
          TAZLAB_HOME: ${{ github.workspace }}/.slitaz
        run: |
          ./tazlab check || true
          ./tazlab config || true
          ./tazlab --version || true

      - name: Create x86_64 SliTaz environment
        working-directory: tazlab
        env:
          TAZLAB_HOME: ${{ github.workspace }}/.slitaz
        run: |
          ./tazlab setup x86_64

      - name: Install TinyOS packages
        working-directory: tazlab
        env:
          TAZLAB_HOME: ${{ github.workspace }}/.slitaz
        run: |
          ./tazlab run x86_64 '
            set -e

            echo "Refreshing package database..."
            tazpkg recharge

            echo "Installing TazLito..."
            tazpkg get-install tazlito

            echo "Installing Firefox..."
            tazpkg get-install firefox

            echo "Installing X server..."
            tazpkg get-install xorg-server

            echo "Installing X initialization..."
            tazpkg get-install xorg-xinit

            echo "Installing Wi-Fi tools..."
            tazpkg get-install wpa_supplicant
            tazpkg get-install dhcpcd

            echo "Installing Bluetooth..."
            tazpkg get-install bluez

            echo "Installing D-Bus..."
            tazpkg get-install dbus

            echo "Packages installed."
          '

      - name: Configure TinyOS
        working-directory: tazlab
        env:
          TAZLAB_HOME: ${{ github.workspace }}/.slitaz
        run: |
          ./tazlab run x86_64 '
            set -e

            echo "Creating TinyOS identity..."

            cat > /etc/hostname << "EOF"
            tinyos
            EOF

            cat > /etc/os-release << "EOF"
            PRETTY_NAME="TinyOS"
            NAME="TinyOS"
            ID=tinyos
            VERSION="0.1"
            VERSION_ID="0.1"
            ID_LIKE=slitaz
            EOF

            echo "Creating Firefox launcher..."

            cat > /usr/bin/firefox-start << "EOF"
            #!/bin/sh
            exec startx
            EOF

            chmod +x /usr/bin/firefox-start

            echo "Creating X session..."

            cat > /root/.xinitrc << "EOF"
            #!/bin/sh
            exec firefox
            EOF

            echo "Cleaning unnecessary files..."

            rm -rf /var/cache/tazpkg/*
            rm -rf /var/log/*

            rm -rf /usr/share/doc/*
            rm -rf /usr/share/info/*
            rm -rf /usr/share/man/*

            rm -rf /tmp/*
            rm -rf /var/tmp/*

            echo "TinyOS configuration complete."
          '

      - name: Build TinyOS ISO
        working-directory: tazlab
        env:
          TAZLAB_HOME: ${{ github.workspace }}/.slitaz
        run: |
          ./tazlab run x86_64 '
            set -e

            echo "Starting TazLito ISO generation..."

            mkdir -p /home/slitaz/iso

            rm -f /home/slitaz/iso/TinyOS.iso

            tazlito writeiso lzma TinyOS

            echo "Searching for generated ISO..."

            find /home/slitaz \
              -type f \
              -name "*.iso" \
              -print

            FOUND_ISO=$(find /home/slitaz \
              -type f \
              -name "*.iso" \
              ! -path "/home/slitaz/iso/TinyOS.iso" \
              | head -n 1)

            if [ -z "$FOUND_ISO" ]; then
              echo "ERROR: TazLito did not create an ISO."
              exit 1
            fi

            echo "Found:"
            echo "$FOUND_ISO"

            cp "$FOUND_ISO" /home/slitaz/iso/TinyOS.iso

            echo "Copied ISO to shared directory:"
            ls -lh /home/slitaz/iso/TinyOS.iso
          '

      - name: Verify generated ISO
        run: |
          echo "Checking shared ISO directory..."

          find .slitaz/iso \
            -maxdepth 1 \
            -type f \
            -print \
            -exec ls -lh {} \;

          ISO=".slitaz/iso/TinyOS.iso"

          if [ ! -f "$ISO" ]; then
            echo "ERROR: TinyOS.iso was not copied to the GitHub workspace."
            exit 1
          fi

          echo "TinyOS ISO found."

      - name: Measure ISO
        run: |
          ISO=".slitaz/iso/TinyOS.iso"

          SIZE_MB=$(du -m "$ISO" | cut -f1)

          echo "======================================"
          echo "TinyOS ISO size: ${SIZE_MB} MB"
          echo "======================================"

          if [ "$SIZE_MB" -le 50 ]; then
            echo "50 MB TARGET ACHIEVED"
          else
            echo "Above 50 MB - optimization will be needed"
          fi

      - name: Upload TinyOS ISO
        uses: actions/upload-artifact@v6
        with:
          name: TinyOS-ISO
          path: ".slitaz/iso/TinyOS.iso"
          if-no-files-found: error
