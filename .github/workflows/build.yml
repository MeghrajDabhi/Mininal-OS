name: Build TinyOS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cpio \
            gzip \
            xz-utils \
            rsync \
            wget \
            file \
            util-linux \
            kmod \
            sudo

      - name: Download TazLab
        run: |
          git clone https://github.com/pankso/tazlab.git
          chmod +x tazlab/tazlab

      - name: Configure TazLab paths
        run: |
          cat > tazlab/tazlab.conf << EOF
          SLITAZ_HOME="$GITHUB_WORKSPACE/.slitaz"
          ARCH="x86_64"
          BUILDER="$USER"
          EOF

          echo "TazLab configuration:"
          cat tazlab/tazlab.conf

      - name: Check TazLab
        working-directory: tazlab
        run: |
          ./tazlab check

      - name: Create SliTaz x86_64 environment
        working-directory: tazlab
        run: |
          ./tazlab setup x86_64

      - name: Install TinyOS packages
        working-directory: tazlab
        run: |
          ./tazlab run x86_64 '
            set -e

            echo "Refreshing SliTaz package database..."
            tazpkg recharge

            echo "Installing Firefox..."
            tazpkg get-install firefox

            echo "Installing X server..."
            tazpkg get-install xorg-server

            echo "Installing X initialization..."
            tazpkg get-install xorg-xinit

            echo "Installing Wi-Fi support..."
            tazpkg get-install wpa_supplicant
            tazpkg get-install dhcpcd

            echo "Installing Bluetooth..."
            tazpkg get-install bluez

            echo "Installing D-Bus..."
            tazpkg get-install dbus

            echo "Packages installed successfully."
          '

      - name: Configure TinyOS
        working-directory: tazlab
        run: |
          ./tazlab run x86_64 '
            set -e

            echo "Configuring TinyOS..."

            echo "tinyos" > /etc/hostname

            cat > /etc/os-release << "EOF"
            PRETTY_NAME="TinyOS"
            NAME="TinyOS"
            ID=tinyos
            VERSION="0.1"
            VERSION_ID="0.1"
            ID_LIKE=slitaz
            EOF

            cat > /usr/bin/firefox-start << "EOF"
            #!/bin/sh
            exec startx
            EOF

            chmod +x /usr/bin/firefox-start

            cat > /root/.xinitrc << "EOF"
            #!/bin/sh
            exec firefox
            EOF

            echo "Removing unnecessary cache and logs..."

            rm -rf /var/cache/tazpkg/*
            rm -rf /var/log/*

            echo "Removing documentation..."

            rm -rf /usr/share/doc/*
            rm -rf /usr/share/info/*
            rm -rf /usr/share/man/*

            echo "Removing temporary files..."

            rm -rf /tmp/*
            rm -rf /var/tmp/*

            echo "TinyOS configuration complete."
          '

      - name: Prepare original SliTaz ISO
        working-directory: tazlab
        run: |
          ./tazlab run x86_64 '
            set -e

            mkdir -p /media/cdrom

            BASE_ISO=$(find /home/slitaz/iso \
              -maxdepth 1 \
              -type f \
              -name "*.iso" \
              | head -n 1)

            if [ -z "$BASE_ISO" ]; then
              echo "ERROR: Original SliTaz ISO not found."
              exit 1
            fi

            echo "Original ISO:"
            echo "$BASE_ISO"

            if mountpoint -q /media/cdrom; then
              umount /media/cdrom
            fi

            mount -o loop,ro "$BASE_ISO" /media/cdrom

            echo "Original ISO mounted:"
            ls -la /media/cdrom/boot
          '

      - name: Build TinyOS ISO
        working-directory: tazlab
        run: |
          ./tazlab run x86_64 '
            set -e

            echo "Generating TinyOS ISO..."

            LaunchedByTazpanel=1 \
              tazlito writeiso lzma TinyOS

            echo "Checking generated ISO..."

            if [ ! -f /home/slitaz/distro/TinyOS.iso ]; then
              echo "ERROR: TinyOS.iso was not created."
              echo "Distro directory contents:"
              find /home/slitaz/distro -maxdepth 3 -type f -print
              exit 1
            fi

            echo "TinyOS ISO created successfully."

            ls -lh /home/slitaz/distro/TinyOS.iso
          '

      - name: Verify ISO on GitHub runner
        run: |
          ISO="$GITHUB_WORKSPACE/.slitaz/x86_64/distro/TinyOS.iso"

          echo "Looking for:"
          echo "$ISO"

          if [ ! -f "$ISO" ]; then
            echo "ERROR: TinyOS.iso is missing."
            echo "Available files:"
            find "$GITHUB_WORKSPACE/.slitaz" \
              -type f \
              \( -name "*.iso" -o -name "*.img" \) \
              -print
            exit 1
          fi

          echo "ISO found."
          ls -lh "$ISO"

      - name: Measure ISO size
        run: |
          ISO="$GITHUB_WORKSPACE/.slitaz/x86_64/distro/TinyOS.iso"

          SIZE_MB=$(du -m "$ISO" | cut -f1)

          echo "======================================"
          echo "TinyOS ISO size: ${SIZE_MB} MB"
          echo "======================================"

          if [ "$SIZE_MB" -le 50 ]; then
            echo "TARGET ACHIEVED: 50 MB or smaller."
          else
            echo "TARGET NOT YET ACHIEVED."
            echo "Further optimization is possible."
          fi

      - name: Upload TinyOS ISO
        uses: actions/upload-artifact@v6
        with:
          name: TinyOS-ISO
          path: ".slitaz/x86_64/distro/TinyOS.iso"
          if-no-files-found: error
